<!doctype html>
<!-- Template for public/assets/preview.png (the link preview image). Rebuild with tools/build.sh -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr 470px; background: #14161f; color: #f1e8d6; font-family: Montserrat, system-ui, sans-serif; }
  .text { padding: 72px 64px; display: flex; flex-direction: column; justify-content: center; }
  .mono { font: 600 30px Montserrat, system-ui, sans-serif; letter-spacing: .08em; color: #e9dcc0; margin-bottom: 52px; }
  h1 { font: 600 70px/1.05 Montserrat, system-ui, sans-serif; margin: 0 0 26px; }
  p { font-size: 27px; line-height: 1.4; color: #c9c2d6; margin: 0; }
  .tag { margin-top: 44px; font-size: 19px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #e9dcc0; }
  .img { background: url(../public/assets/arat.webp) 50% 40% / cover; border-left: 10px solid #e9dcc0; }
</style>
</head>
<body>
  <div class="text">
    <div class="mono">GDS</div>
    <h1>Gulyás Dávid Sámuel</h1>
    <p>I create things and solve problems, with numbers, a brush, code or a team.</p>
    <div class="tag">CV · Finance &amp; maths · Art · Web</div>
  </div>
  <div class="img"></div>
</body>
</html>
